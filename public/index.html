<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Week 2 API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 40px 48px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #d62828;
    }
    p {
      margin: 4px 0;
      color: #555;
    }
    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    ul {
      text-align: left;
      display: inline-block;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Week 2 API!</h1>
    <p>The server is up and running.</p>
    <ul>
      <li><code>GET /</code> &mdash; this page</li>
      <li><code>POST /user</code> &mdash; { name, email }</li>
      <li><code>GET /user/:id</code> &mdash; user profile</li>
    </ul>
  </div>
</body>
</html>
